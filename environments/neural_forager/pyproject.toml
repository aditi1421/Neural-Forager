[project]
name = "neural-forager"
description = "A locally learning spiking agent in a changing, partially observed maze"
tags = ["neuroscience", "reinforcement-learning", "eval"]
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "verifiers==0.1.14",
    "nengo==4.1.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "pydantic>=2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
neural-forager = "neural_forager.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["neural_forager", "pyproject.toml"]

[tool.verifiers.eval]
num_examples = 5
rollouts_per_example = 3

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:nengo"
